name: Sync deployed source once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull exact deployed source
        run: curl -fsSL https://roleradar-demo-r6xbppqr0-tyke-crinkly-ajar-5518.vercel.app/ -o index.html
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "chore: sync deployed source"
            git push
          fi
