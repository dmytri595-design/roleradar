name: CommitPulse browser smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'commitpulse/**'
      - '.github/workflows/commitpulse-live-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --directory commitpulse >/tmp/commitpulse-server.log 2>&1 &
      - name: Run browser smoke
        env:
          SMOKE_URL: http://127.0.0.1:4173
        run: node commitpulse/e2e/live-smoke.cjs
