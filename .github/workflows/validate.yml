name: Validate RoleRadar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          test -s index.html
          python - <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          start = text.find("<script>")
          end = text.rfind("</script>")
          assert start >= 0 and end > start, "Missing script block"
          Path("/tmp/roleradar.js").write_text(text[start + 8:end], encoding="utf-8")
          PY
          node --check /tmp/roleradar.js
          grep -q "RoleRadar" README.md
