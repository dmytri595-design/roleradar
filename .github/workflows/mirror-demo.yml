name: Mirror live demo source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull current live source
        run: curl -fsSL https://roleradar-demo.vercel.app/ -o index.html
      - name: Commit live source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No live-source changes."
          else
            git commit -m "chore: mirror live demo source"
            git push
          fi
